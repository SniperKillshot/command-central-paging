# C interface to blip25-vocoder (https://github.com/openBLIP25/blip25-vocoder),
# loaded by src/p25/blip25.py. Build with: python tools/build_native.py
[package]
name = "ccp_blip25"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
blip25-vocoder = { path = "vendor/blip25-vocoder" }   # 1.0.0 + patches, see PATCHES.md

[profile.release]
opt-level = 3
